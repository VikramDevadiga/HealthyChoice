allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// AGP 8+ requires namespace in every Android module.
// Older Flutter plugins may only declare package in AndroidManifest.xml,
// so derive namespace from manifest when missing.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("namespace")) {
            def currentNamespace = androidExt.namespace
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlSlurper(false, false).parse(manifestFile)
                    def manifestPackage = manifest.@package?.text()
                    if (manifestPackage != null && !manifestPackage.trim().isEmpty()) {
                        androidExt.namespace = manifestPackage
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
